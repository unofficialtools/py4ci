[tasks.my-heartbeat]
enabled = true
description = "checks the date every 1h"
queues = ["default"]
tags = ["heartbeat"]
period = "1h"
debounce = "1m"
priority = 0
timeout = "180s"
command = """
date
"""
authorized_users = ["me"]

[tasks.my-repo-change]
enabled = true
description = "list files when repo changes"
queues = ["default"]
tags = ["repo"]
priority = 0
timeout = "180s"
command = """
git clone https://github.com/web2py/py4web.git
pushd py4web
ls -l
popd
echo "DONE!"
"""
authorized_users = ["me"]

[[tasks.my-repo-change.triggered_by]]
ssh_url = "git@github.com:web2py/py4web.git"
branches = ["master"]

[tasks.my-repo-change-followup]
enabled = true
description = "just prints done!"
queues = ["default"]
priority = 0
timeout = "180s"
command = """
echo "DONE!"
"""
authorized_users = ["me"]

[[tasks.my-repo-change-followup.triggered_by]]
task = "my-repo-change"
